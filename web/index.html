<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1a6b">
  <!-- La app ya es oscura: evita que el "modo oscuro" del navegador (Samsung Internet, Chrome) altere los colores -->
  <meta name="color-scheme" content="dark only">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Envíos">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Plataforma de gestión de envíos: crea, paga, sigue y entrega envíos con QR y foto de constancia.">
  <title>Gestión de Envíos</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icono-192.png">
  <link rel="preload" href="fonts/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
  <!-- Descarga todos los módulos en paralelo (evita la cascada de importaciones con 4G, RNF-03) -->
  <link rel="modulepreload" href="js/api.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/vistas/comun.js">
  <link rel="modulepreload" href="js/vistas/cliente.js">
  <link rel="modulepreload" href="js/vistas/envios.js">
  <link rel="modulepreload" href="js/vistas/repartidor.js">
  <link rel="modulepreload" href="js/vistas/admin.js">
  <link rel="modulepreload" href="js/vistas/publico.js">
  <link rel="modulepreload" href="js/vistas/cuenta.js">
</head>
<body>
  <div id="app" class="shell">
    <header class="topbar">
      <a class="marca" href="#/">
        <img src="icons/icono.svg" alt="" width="56" height="56">
        <span><strong id="marca-nombre">Tu Empresa de Envíos</strong><small>Gestión de envíos</small></span>
      </a>
      <div class="topbar-der">
        <span class="chip-demo" title="Sin inicio de sesión: elige un perfil para recorrer la plataforma">Modo demo</span>
        <button class="perfil-chip solo-movil" id="chip-perfil" aria-label="Cambiar perfil"><span class="avatar" id="chip-avatar">?</span><span id="chip-rol">Perfil</span></button>
        <label class="perfil solo-escritorio-top">
          <span class="sr">Perfil</span>
          <select id="selector-perfil" aria-label="Perfil de demostración"></select>
        </label>
        <button class="btn-icono solo-escritorio-top" id="btn-servidor" title="Servidor API (localhost / Railway)" aria-label="Configurar servidor">
          <span class="punto-estado" id="estado-api"></span>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 5h16v5H4zm0 9h16v5H4zm3-7.5A1 1 0 1 0 7 8.5 1 1 0 0 0 7 6.5m0 9a1 1 0 1 0 0 2 1 1 0 0 0 0-2"/></svg>
        </button>
      </div>
    </header>
    <nav class="menu" id="menu" aria-label="Navegación principal"></nav>
    <main id="vista" class="vista" tabindex="-1"></main>
  </div>
  <div id="modal-raiz"></div>
  <div id="toasts" aria-live="polite"></div>
</body>
</html>
